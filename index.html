<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter vs Hider</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="pets/pets.css">
</head>
<body>

<div id="lobby" class="screen active">
  <h2>Lobby</h2>
  <input id="nameInput" placeholder="Player name">
  <button onclick="addPlayer()">Add</button>
  <ul id="playerList"></ul>
  <button onclick="startSpin()">Start (all must be ready)</button>
  <div id="spinner"></div>
</div>

<div id="game" class="screen" style="padding:0;max-width:none;">
  <div id="hud"></div>
  <div id="petBox"></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/lobby.js"></script>
<script src="js/spinner.js"></script>
<script src="pets/pets.js"></script>
<script src="js/map.js"></script>
</body>
</html>
